<!DOCTYPE html>
    <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
            <title>CYBER 2048</title>
            <style>
                * {
                    box-sizing: border-box;
                    -webkit-tap-highlight-color:
                        transparent;
                }
                html,
                body {
                    width: 100%;
                    height: 100%;
                    margin: 0;
                    padding: 0;
                    overflow: hidden;
                    background:
                        radial-gradient(
                            circle at center,
                            #071b24 0%,
                            #02080d 50%,
                            #000000 100%
                        );
                    font-family:
                        "Courier New",
                        monospace;
                    color: #00ffff;
                }
                body::before {
                    content: "";
                    position: fixed;
                    inset: 0;
                    pointer-events: none;
                    z-index: 1000;
                    background:
                        repeating-linear-gradient(
                            0deg,
                            rgba(0,255,255,0.025),
                            rgba(0,255,255,0.025) 1px,
                            transparent 1px,
                            transparent 4px
                        );
                }
                body {
                    display: flex;
                    justify-content: center;
                    align-items: center;
                }
                .game {
                    width: min(94vw, 430px);
                    padding: 15px;
                    position: relative;
                    border: 1px solid #00ffff;
                    background:rgba(0, 18, 27, 0.78);
                    box-shadow:
                        0 0 8px #00ffff,
                        0 0 25px
                        rgba(0,255,255,0.25),
                        inset 0 0 25px
                        rgba(0,255,255,0.05);
                }
                .top {

                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    margin-bottom: 10px;
                }
                .title {
                    font-size: 22px;
                    font-weight: bold;
                    letter-spacing: 3px;
                    color: #00ffff;
                    text-shadow:
                        0 0 4px #00ffff,
                        0 0 12px #00ffff;
                }
                .status {
                    font-size: 8px;
                    color: #00ff88;
                    letter-spacing: 1px;
                    text-shadow: 0 0 5px #00ff88;
                }
                .score-area {
                    display: flex;
                    justify-content: space-between;
                    gap: 8px;
                    margin-bottom: 10px;
                }
                .score-box {
                    flex: 1;
                    padding: 5px 8px;
                    border: 1px solid #07515a;
                    background:rgba(0,255,255,0.035);
                    text-align: center;
                }
                .score-title {
                    font-size: 8px;
                    color: #438a91;
                    letter-spacing: 2px;
                }
                .score {
                    font-size: 17px;
                    color: #dfffff;
                    text-shadow: 0 0 7px #00ffff;
                }
                .board {
                    width: 100%;
                    aspect-ratio: 1 / 1;
                    position: relative;
                    padding: 8px;
                    background:rgba(0, 12, 18, 0.95);
                    border: 1px solid #00ffff;
                    box-shadow:
                        inset 0 0 20px
                        rgba(0,255,255,0.08),
                        0 0 15px
                        rgba(0,255,255,0.3);
                    touch-action: none;
                    overflow: hidden;
                }
                .background-grid {
                    position: absolute;
                    left: 8px;
                    top: 8px;
                    right: 8px;
                    bottom: 8px;
                    display: grid;
                    grid-template-columns: repeat(4, 1fr);
                    gap: 7px;
                    pointer-events: none;
                    z-index: 1;
                }
                .background-cell {
                    border: 1px solid #073941;
                    background:
                        linear-gradient(
                            135deg,
                            rgba(0,255,255,0.035),
                            rgba(0,20,30,0.5)
                        );
                    box-shadow:
                        inset 0 0 8px
                        rgba(0,255,255,0.025);
                }
                .tile {
                    position: absolute;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    transition:
                        transform
                        190ms
                        cubic-bezier(
                            0.22,
                            0.75,
                            0.25,
                            1
                        );
                    will-change:
                        transform;
                    z-index: 5;
                    border:
                        1px solid #07515a;
                    background:
                        linear-gradient(
                            135deg,
                            rgba(0,255,255,0.05),
                            rgba(0,20,30,0.7)
                        );
                    font-size:
                        clamp(18px, 7vw, 32px);
                    font-weight: bold;
                    text-shadow:
                        0 0 5px currentColor;
                    pointer-events: none;
                }
                .tile::before {
                    content: "";
                    position: absolute;
                    left: 3px;
                    top: 3px;
                    width: 8px;
                    height: 8px;
                    border-top: 1px solid currentColor;
                    border-left: 1px solid currentColor;
                    opacity: 0.7;
                }
                .tile::after {
                    content: "";
                    position: absolute;
                    right: 3px;
                    bottom: 3px;
                    width: 8px;
                    height: 8px;
                    border-right: 1px solid currentColor;
                    border-bottom: 1px solid currentColor;
                    opacity: 0.7;
                }
                .tile span {
                    position: relative;
                    z-index: 3;
                    transform: skewX(-4deg);
                    color: inherit;
                    text-shadow:
                        0 0 3px currentColor,
                        0 0 8px currentColor,
                        0 0 15px currentColor;
                }
                .tile span::after {
                    content: attr(data-number);
                    position: absolute;
                    left: 2px;
                    top: 1px;
                    color: currentColor;
                    opacity: 0.22;
                    filter: blur(1px);
                    z-index: -1;
                }
                .tile[data-value="2"] {
                    color: #00ffff;
                    border-color:#00ffff;
                    box-shadow:
                        0 0 6px
                        rgba(0,255,255,0.65),
                        inset 0 0 10px
                        rgba(0,255,255,0.08);
                }
                .tile[data-value="4"] {
                    color: #00eaff;
                    border-color:#00eaff;
                    box-shadow: 0 0 8px rgba(0,234,255,0.7);
                }
                .tile[data-value="8"] {
                    color: #00ff88;
                    border-color:#00ff88;
                    box-shadow:0 0 9px rgba(0,255,136,0.75);
                }
                .tile[data-value="16"] {
                    color: #aaff00;
                    border-color:#aaff00;
                    box-shadow: 0 0 10px rgba(170,255,0,0.8);
                }
                .tile[data-value="32"] {
                    color: #ffff00;
                    border-color:#ffff00;
                    box-shadow: 0 0 11pxrgba(255,255,0,0.8);
                }
                .tile[data-value="64"] {
                    color: #ff9900;
                    border-color:#ff9900;
                    box-shadow: 0 0 12pxrgba(255,153,0,0.85);
                }
                .tile[data-value="128"] {
                    color: #ff5500;
                    border-color:#ff5500;
                    box-shadow: 0 0 13px rgba(255,85,0,0.85);
                }
                .tile[data-value="256"] {
                    color: #ff00aa;
                    border-color:#ff00aa;
                    box-shadow: 0 0 15pxrgba(255,0,170,0.9);
                }
                .tile[data-value="512"] {
                    color: #cc00ff;
                    border-color:#cc00ff;
                    box-shadow:0 0 17px rgba(204,0,255,0.9);
                }
                .tile[data-value="1024"] {
                    color: #6688ff;
                    border-color: #6688ff;
                    box-shadow:
                        0 0 18px
                        rgba(102,136,255,1);
                }
                .tile[data-value="2048"] {
                    color: #ffffff;
                    border-color:#ff00ff;
                    background:
                        linear-gradient(
                            135deg,
                            rgba(255,0,255,0.15),
                            rgba(0,255,255,0.15)
                        );
                    box-shadow:
                        0 0 10px #ff00ff,
                        0 0 25px #00ffff,
                        inset 0 0 20px
                        rgba(255,0,255,0.15);
                }
                .tile.new {
                    animation:
                        tileSpawn
                        180ms
                        cubic-bezier(
                            0.2,
                            1.5,
                            0.4,
                            1
                        );
                }
                @keyframes tileSpawn {
                    0% {
                        opacity: 0;
                        transform:
                            translate(
                                var(--x),
                                var(--y)
                            )
                            scale(0.1);
                    }
                    60% {
                        opacity: 1;
                        transform:
                            translate(
                                var(--x),
                                var(--y)
                            )
                            scale(1.15);
                    }
                    100% {
                        opacity: 1;
                        transform:
                            translate(
                                var(--x),
                                var(--y)
                            )
                            scale(1);
                    }
                }
                .tile.merge {
                    animation:
                        mergePulse
                        180ms
                        ease-out;
                }
                @keyframes mergePulse {
                    0% {
                        transform:
                            translate(var(--x),var(--y))
                            scale(1);
                    }
                    45% {
                        transform:
                            translate(var(--x),var(--y))
                            scale(1.18);
                        filter:
                            brightness(1.8);
                    }
                    100% {
                        transform:
                            translate(var(--x),var(--y))
                            scale(1);
                    }
                }
                .merge-flash {
                    position: absolute;
                    width: 15px;
                    height: 15px;
                    border-radius: 50%;
                    pointer-events: none;
                    z-index: 10;
                    background:#ffffff;
                    box-shadow:
                        0 0 5px #ffffff,
                        0 0 15px #00ffff,
                        0 0 30px #ff00ff;
                    animation:
                        flash
                        220ms
                        ease-out
                        forwards;
                }
                @keyframes flash {
                    0% {
                        opacity: 1;
                        transform:
                            translate(-50%, -50%)
                            scale(0.3);
                    }
                    100% {
                        opacity: 0;
                        transform:
                            translate(-50%, -50%)
                            scale(5);
                    }
                }
                .footer {
                    margin-top: 10px;
                    display: flex;
                    justify-content: space-between;
                    font-size: 9px;
                    color: #39777e;
                    letter-spacing: 1px;
                }
                .footer strong {
                    color: #00ffff;
                    text-shadow: 0 0 5px #00ffff;
                }
                .game-over {
                    position: absolute;
                    inset: 0;
                    z-index: 50;
                    display: flex;
                    flex-direction: column;
                    justify-content: center;
                    align-items: center;
                    text-align: center;
                    background:rgba(0,4,9,0.93);
                }
                .game-over.hidden {
                    display: none;
                }
                .game-over h2 {
                    margin: 0;
                    color: #ff00ff;
                    font-size: 27px;
                    letter-spacing: 4px;
                    text-shadow:
                        0 0 5px #ff00ff,
                        0 0 20px #ff00ff;
                }
                .game-over p {
                    color: #00ffff;
                    font-size: 10px;
                    letter-spacing: 2px;
                }
                .restart {
                    margin-top: 14px;
                    padding: 10px 25px;
                    background:rgba(0,255,255,0.04);
                    border: 1px solid #00ffff;
                    color: #00ffff;
                    font-family: "Courier New", monospace;
                    letter-spacing: 2px;
                    cursor: pointer;
                    box-shadow: 0 0 10px rgba(0,255,255,0.5);
                }
                .restart:active {
                    background:rgba(0,255,255,0.2);
                    box-shadow: 0 0 20px #00ffff;
                }
                .win {
                    animation:
                        winPulse
                        600ms
                        ease-in-out
                        infinite alternate;
                }
                @keyframes winPulse {
                    from {
                        box-shadow:
                            0 0 10px #ff00ff,
                            0 0 25px #00ffff;
                    }
                    to {

                        box-shadow:
                            0 0 25px #ff00ff,
                            0 0 50px #00ffff;
                    }
                }
                @media (max-height: 600px) {
                    .game {
                        width: min(90vw, 350px);
                        padding: 10px;
                    }
                    .title {
                        font-size: 17px;
                    }
                    .status {
                        font-size: 7px;
                    }
                    .score-area {
                        margin-bottom: 7px;
                    }
                    .footer {

                        margin-top: 7px;
                    }
                }
            </style>
        </head>
        <body>
            <div class="game">
                <div class="top">
                    <div class="title">
                        CYBER_2048
                    </div>
                    <div class="status">
                        ● SYSTEM ONLINE
                    </div>
                </div>
                <div class="score-area">
                    <div class="score-box">
                        <div class="score-title">
                            SCORE
                        </div>
                        <div
                            id="score"
                            class="score">
                            0
                        </div>
                    </div>
                    <div class="score-box">
                        <div class="score-title">
                            HIGH SCORE
                        </div>
                        <div
                            id="highScore"
                            class="score">
                            0
                        </div>
                    </div>
                </div>
                <div
                    id="board"
                    class="board">

                </div>
                <div class="footer">
                    <span>
                        SWIPE / ARROWS / WASD
                    </span>
                    <strong>
                        MOVE
                    </strong>
                </div>
                <div id="gameOver" class="game-over hidden">
                    <h2>
                        SYSTEM LOCKED
                    </h2>
                    <p>
                        NO MORE MOVES
                    </p>
                    <button id="restart" class="restart">
                        REBOOT
                    </button>
                </div>
            </div>
            <script>
            const SIZE = 4;
            const MOVE_DURATION = 200;
            const TILE_GAP = 7;
            const BOARD_PADDING = 8;

            let board = [];
            let score = 0;

            let highScore = Number(localStorage.getItem("cyber2048_highscore")) || 0;

            let tiles = {};
            let nextTileId = 1;
            let animationRunning = false;

            const boardElement = document.getElementById("board");
            const scoreElement = document.getElementById("score");

            const highScoreElement = document.getElementById("highScore");
            const gameOverElement = document.getElementById("gameOver");
            const restartButton = document.getElementById("restart");

            function getGeometry() {
                const width = boardElement.clientWidth;
                const innerWidth = width - BOARD_PADDING * 2;

                const tileSize = (innerWidth - TILE_GAP * 3) / 4;
                return {
                    tileSize
                };
            }

            function getTilePosition(x, y) {
                const geometry = getGeometry();

                const posX = BOARD_PADDING + x * (geometry.tileSize + TILE_GAP)
                const posY = BOARD_PADDING + y * (geometry.tileSize + TILE_GAP);

                return {
                    x: posX,
                    y: posY
                };
            }

            function createBackground() {
                const background = document.createElement("div");

                background.className = "background-grid";
                for (let i = 0; i < SIZE * SIZE; i++) {

                    const cell = document.createElement("div");

                    cell.className = "background-cell";
                    background.appendChild(cell);
                }

                boardElement.appendChild(background);
            }

            function createTile(value, x, y, isNew = false) {
                const id = nextTileId++;
                const element = document.createElement("div");

                element.className = "tile";
                element.dataset.value = value;

                const geometry = getGeometry();
                
                element.style.width = geometry.tileSize + "px";
                element.style.height = geometry.tileSize + "px";

                const number = document.createElement("span");

                number.textContent = value;
                number.dataset.number = value;

                element.appendChild(number);

                const position = getTilePosition(x, y);


                element.style.setProperty("--x", position.x + "px");
                element.style.setProperty("--y", position.y + "px");

                element.style.transform =`translate(
                        ${position.x}px,
                        ${position.y}px
                    )`;
                boardElement.appendChild(element);

                tiles[id] = {
                    id,
                    value,
                    x,
                    y,
                    element
                };
                
                if (isNew) {
                    element.classList.add(
                        "new"
                    );
                }
                return id;
            }

            function updateTileElement(tile, value) {
                tile.value = value;
                tile.element.dataset.value = value;

                const number = tile.element.querySelector("span");

                if (number) {
                    number.textContent = value;
                    number.dataset.number = value;
                }
            }

            function moveTile(tile, x, y) {

                tile.x = x;
                tile.y = y;

                const position = getTilePosition(x, y);

                tile.element.style.setProperty(
                    "--x",
                    position.x + "px"
                );

                tile.element.style.setProperty(
                    "--y",
                    position.y + "px"
                );

                tile.element.style.transform =
                    `translate(
                        ${position.x}px,
                        ${position.y}px
                    )`;
            }

            function removeTile(tile) {

                if (!tile)
                    return;

                tile.element.remove();

                delete tiles[tile.id];
            }

            function createMergeFlash(x, y) {

                const flash =document.createElement("div");

                flash.className = "merge-flash";

                const position =getTilePosition(x, y);
                const geometry = getGeometry();

                flash.style.left = (position.x + geometry.tileSize / 2) + "px";
                flash.style.top = (position.y + geometry.tileSize / 2) + "px";

                boardElement.appendChild(flash);

                setTimeout(() => {
                        flash.remove();
                    },
                    250
                );
            }

            function getState() {

                const state = Array.from({ length: SIZE }, () =>
                    Array(SIZE).fill(null));

                Object.values(tiles).forEach(tile => {
                        state[tile.y][tile.x] = tile;
                });

                return state;
            }

            function initGame() {
                Object.values(tiles).forEach(tile =>
                            tile.element.remove()
                );

                tiles = {};
                nextTileId = 1;
                score = 0;

                gameOverElement.classList.add("hidden");
                
                addRandomTile(true);
                addRandomTile(true);
                updateScore();
            }

            function addRandomTile(animate = false) {
                const state = getState();

                const empty = [];

                for (let y = 0; y < SIZE; y++) {
                    for (let x = 0; x < SIZE; x++) {
                        if (state[y][x] === null) {
                            empty.push({
                                x,
                                y
                            });
                        }
                    }
                }

                if (empty.length === 0) {
                    return null;
                }

                const position =
                    empty[
                        Math.floor(
                            Math.random() *
                            empty.length
                        )
                    ];

                const value = Math.random() < 0.9 ? 2 : 4;

                return createTile(
                    value,
                    position.x,
                    position.y,
                    animate
                );
            }

            function findTile(x, y) {

                return Object.values(tiles).find(tile =>
                            tile.x === x &&
                            tile.y === y
                    );
            }

            function calculateMove(direction) {

                const state = getState();

                const result = {
                    movements: [],
                    merges: [],
                    changed: false
                };
                let xs = [0, 1, 2, 3];
                let ys = [0, 1, 2, 3];

                if (direction === "right") {
                    xs.reverse();
                }

                if (direction === "down") {
                    ys.reverse();
                }

                if (direction === "left" || direction === "right") {
                    for (let yIndex = 0; yIndex < ys.length; yIndex++) {
                        const y = ys[yIndex];
                        let line = [];

                        for (let i = 0; i < xs.length; i++) {
                            const x = xs[i];
                            const tile = state[y][x];

                            if (tile !== null) {
                                line.push(tile);
                            }
                        }

                        let target = direction === "left" ? 0 : 3;
                        let step = direction === "left" ? 1 : -1;

                        for (let i = 0; i < line.length; i++) {
                            const tile = line[i];
                            const next = line[i + 1];

                            if (next &&next.value === tile.value) {
                                result.movements.push({
                                    tile,
                                    toX: target,
                                    toY: y
                                });

                                result.merges.push({
                                    source: next,
                                    targetTile: tile,
                                    x: target,
                                    y
                                });

                                result.movements.push({
                                    tile: next,
                                    toX: target,
                                    toY: y
                                });

                                score += tile.value * 2;
                                i++;
                                target += step;
                            } else {
                                result.movements.push({
                                    tile,
                                    toX: target,
                                    toY: y
                                });
                                target += step;
                            }
                        }
                    }
                } else {
                    for (let xIndex = 0; xIndex < xs.length; xIndex++) {
                        const x = xs[xIndex];

                        let line = [];

                        for (let i = 0; i < ys.length; i++) {
                            const y = ys[i];
                            const tile = state[y][x];

                            if (tile !== null) {
                                line.push(tile);
                            }
                        }

                        let target = direction === "up" ? 0 : 3;
                        let step = direction === "up" ? 1 : -1;

                        for (let i = 0; i < line.length; i++) {
                            const tile = line[i];
                            const next = line[i + 1];

                            if (next && next.value === tile.value) {
                                result.movements.push({
                                    tile,
                                    toX: x,
                                    toY: target
                                });
                                result.merges.push({
                                    source: next,
                                    targetTile: tile,
                                    x, 
                                    y: target
                                });

                                result.movements.push({
                                    tile: next,
                                    toX: x,
                                    toY: target
                                });

                                score += tile.value * 2;
                                i++;
                                target += step;
                            } else {
                                result.movements.push({
                                    tile,
                                    toX: x,
                                    toY: target
                                });
                                target += step;
                            }
                        }
                    }
                }

                result.movements
                    .forEach(move => {
                        if (move.tile.x !== move.toX || move.tile.y !== move.toY) {
                            result.changed = true;
                        }
                    });

                if (result.merges.length > 0) {
                    result.changed = true;
                }

                return result;
            }

            function executeMove(direction) {
                if (animationRunning)
                    return;

                const result = calculateMove(direction);

                if (!result.changed) {
                    if (!canMove()) {
                        showGameOver();
                    }
                    return;
                }

                animationRunning = true;

                result.movements.forEach(move => {
                        moveTile(
                            move.tile,
                            move.toX,
                            move.toY
                        );
                    });
                    
                setTimeout(() => {
                        result.merges.forEach(merge => {
                                const target = merge.targetTile;
                                const source = merge.source;

                                removeTile(source);

                                const newValue = target.value * 2;
                                updateTileElement(target, newValue);
                                target.element.classList.remove("merge");
                                
                                void target.element.offsetWidth;

                                target.element.classList.add("merge");
                                createMergeFlash(merge.x, merge.y);
                            });

                        result.movements.forEach(move => {
                                const isSource = result.merges.some(merge => merge.source === move.tile);
                                if (isSource)
                                    return;
                            });

                        addRandomTile(true);

                        updateScore();

                        const has2048 = Object.values(tiles)
                                .some(tile => tile.value >= 2048);

                        if (has2048) {
                            showWin();
                        }

                        if (!canMove()) {
                            setTimeout(() => {
                                    showGameOver();
                                }, 250);
                        }

                        animationRunning = false;
                    },
                    MOVE_DURATION + 20
                );
            }

            function canMove() {
                const state = getState();

                for (let y = 0; y < SIZE; y++) {
                    for (let x = 0; x < SIZE; x++) {
                        if (state[y][x] === null) {
                            return true;
                        }
                    }
                }

                for (let y = 0; y < SIZE; y++) {
                    for (let x = 0; x < SIZE - 1; x++) {
                        if (state[y][x].value === state[y][x + 1].value) {
                            return true;
                        }
                    }
                }

                for (let y = 0; y < SIZE - 1; y++) {
                    for (let x = 0; x < SIZE; x++) {
                        if (state[y][x].value === state[y + 1][x].value) {
                            return true;
                        }
                    }
                }
                return false;
            }

            function updateScore() {
                scoreElement.textContent = score;

                if (score > highScore) {
                    highScore = score;

                    localStorage.setItem(
                        "cyber2048_highscore",
                        highScore
                    );
                }
                highScoreElement.textContent = highScore;
            }

            function showGameOver() {
                gameOverElement.classList.remove("hidden");
            }

            function showWin() {
                const title = gameOverElement.querySelector("h2");
                const text = gameOverElement.querySelector("p");

                title.textContent = "2048 ACHIEVED";
                text.textContent = "SYSTEM OVERRIDE";

                gameOverElement.classList.remove("hidden");
                gameOverElement.classList.add("win");
            }

            document.addEventListener(
                "keydown", event => {
                    switch (event.key) {
                        case "ArrowLeft":

                        case "a":

                        case "A":
                            event.preventDefault();
                            executeMove("left");
                            break;

                        case "ArrowRight":

                        case "d":

                        case "D":
                            event.preventDefault();
                            executeMove("right");
                            break;

                        case "ArrowUp":
                        
                        case "w":
                        
                        case "W":
                            event.preventDefault();
                            executeMove("up");
                            break;
                        
                        case "ArrowDown":
                        
                        case "s":
                        
                        case "S":
                            event.preventDefault();
                            executeMove("down");
                            break;
                    }
                }
            );

            let touchStartX = 0;
            let touchStartY = 0;

            boardElement.addEventListener(
                "touchstart", event => {
                    const touch = event.changedTouches[0];
                    touchStartX = touch.clientX;
                    touchStartY = touch.clientY;
                },
                {
                    passive: true
                }
            );

            boardElement.addEventListener(
                "touchend", event => {
                    const touch = event.changedTouches[0];
                    const dx = touch.clientX - touchStartX;
                    const dy = touch.clientY - touchStartY;
                    const minimum = 25;

                    if (Math.abs(dx) < minimum && Math.abs(dy) < minimum) {

                        return;
                    }

                    if (Math.abs(dx) > Math.abs(dy)) {
                        if (dx > 0) {
                            executeMove("right");
                        } else {
                            executeMove("left");
                        }
                    } else {
                        if (dy > 0) {
                            executeMove("down");
                        } else {
                            executeMove("up");
                        }
                    }
                },
                {
                    passive: true
                }
            );

            restartButton.addEventListener(
                "click", () => {
                    gameOverElement.classList.add("hidden");
                    gameOverElement.classList.remove("win");

                    const title =gameOverElement.querySelector("h2");
                    const text = gameOverElement.querySelector("p");
                    
                    title.textContent = "SYSTEM LOCKED";
                    text.textContent = "NO MORE MOVES";
                    initGame();
                }
            );

            window.addEventListener(
                "resize", () => {
                    Object.values(tiles)
                        .forEach(tile => {
                            const geometry = getGeometry();
                            tile.element.style.width = geometry.tileSize + "px";
                            tile.element.style.height = geometry.tileSize + "px";

                            const position = getTilePosition(tile.x, tile.y);
                            tile.element.style.transform = `translate(${position.x}px, ${position.y}px)`;
                        });
                }
            );

            createBackground();
            initGame();
            </script>
        </body>
    </html>
